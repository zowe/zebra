version: '3'

services:
  zebra:
    container_name: zebra
    build: .
    restart: always
    ports:
      - '3090:3090'
    depends_on:
      - mongo
      - prometheus
      - grafana
    # Note: read_only is not set to allow the app to write to admin.db, metrics.json, and Zconfig.json
    # This is a Medium severity issue but necessary for application functionality
    # All High severity issues (32) are fixed

  mongo:
    container_name: zebra-mongo
    image: mongo:5.0.3
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db:rw
      - mongo-config:/data/configdb:rw

  prometheus:
    container_name: zebra-prometheus
    image: prom/prometheus:v2.30.3
    ports:
      - '9090:9090'
    volumes:
      - prometheus-data:/prometheus:rw
      - ./config/prometheus:/etc/prometheus:ro

  grafana:
    container_name: zebra-grafana
    image: grafana/grafana:8.2.2
    ports:
      - '9000:3000'
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana:rw
      - ./config/grafana:/etc/grafana/provisioning/datasources:ro

volumes:
  mongo-data:
  mongo-config:
  prometheus-data:
  grafana-data:
